<!DOCTYPE html>
<html>
    <head>
        <title>Marks Sheet</title>
        <script src="MarkSheetEx.js"></script>
    </head>
    <body>
        <h3>Marks Sheet</h3>
        <label for="lblTelugu">Telugu :</label>
        <input id="txtTelugu" placeholder="Enter your marks">
        <label for="lblHindi">Hindi :</label>
        <input id="txtHindi" placeholder="Enter your marks">
        <label for="lblEnglish">English :</label>
        <input id="txtEnglish" placeholder="Enter your marks">
        <label for="lblMaths">Maths :</label>
        <input id="txtMaths" placeholder="Enter your marks">
        <label for="lblScience">Science :</label>
        <input id="txtScience" placeholder="Enter your marks">
        <label for="lblSocial">Social :</label>
        <input id="txtSocial" placeholder="Enter your marks">
        <button id="btnSubmit" onclick="onClickSubmit()">Submit</button>
        <div id="pTelugu"></div>
        <div id="pHindi"></div>
        <div id="pEnglish"></div>
        <div id="pMaths"></div>
        <div id="pScience"></div>
        <div id="pSocial"></div>
    </body>
</html>
