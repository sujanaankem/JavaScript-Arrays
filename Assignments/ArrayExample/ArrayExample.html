<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Example</title>
    <link rel="stylesheet" href="ArrayExample.css">
</head>

<body>

    <div class="container">
        <h1>Student Array Example</h1>

        <input type="text" id="studentName" placeholder="Enter Student Name">

        <button onclick="addStudent()">Add Student</button>
        <button onclick="displayStudents()">Display Students</button>
        <button onclick="closeStudents()">Close List</button>

        <h3>Total Students: <span id="count">0</span></h3>

        <ul id="studentList"></ul>
    </div>

    <script src="ArrayExample.js"></script>

</body>

</html>
